<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTsummer0908</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --tag-bg: #1f3a5f;
      --tag-text: #58a6ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--border);
      margin-bottom: 20px;
      background: var(--border);
      object-fit: cover;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .handle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 24px;
      border-left: 3px solid var(--border);
      padding-left: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #1f6feb;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .links a:hover {
      border-color: var(--border);
      background: var(--bg);
      color: var(--accent-hover);
    }

    .links a .icon { font-size: 1rem; width: 20px; text-align: center; }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar"
         src="https://avatars.githubusercontent.com/u/78398392?v=4"
         alt="avatar" />

    <h1>HTsummer0908</h1>
    <div class="handle">@HTsummer0908</div>

    <p class="bio">
      <!-- 个人简介，可自行修改 -->
      Software developer · Knowledge notes enthusiast
    </p>

    <div class="tags">
      <span class="tag">Java</span>
      <span class="tag">JavaScript</span>
      <span class="tag">SQL</span>
      <span class="tag">Copilot</span>
    </div>

    <hr class="divider" />

    <div class="links">
      <a href="https://github.com/HTsummer0908" target="_blank" rel="noopener">
        <span class="icon">⌥</span> GitHub Profile
      </a>
      <!-- 可继续添加更多链接，如博客、LinkedIn 等 -->
    </div>

    <footer>Updated 2026 · Private repository</footer>
  </div>
</body>
</html>
